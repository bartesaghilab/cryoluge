
[workspace]
name = "cryoluge"
description = "A library for high-performance analysis of data from Cryo-EM and Cryo-ET"
version = "0.1.0"
authors = ["jeff <jeff@cuchazinteractive.com>"]
platforms = ["linux-64"]
channels = [
    "https://conda.modular.com/max-nightly",
    "conda-forge"
]

[dependencies]
# see releases here: https://prefix.dev/channels/max-nightly/packages/mojo
mojo = "==1.2.0"
# TODO: enable max when the compiler stops crashing long enough to compile closures for the Mutex
# max = "==26.7"  # only needed for parallelize() to test Mutex

[tasks]
build_dir = "rm -rf build 2> /dev/null; mkdir -p build"

[tasks.build_pkg]
cmd = "mojo precompile -o build/cryoluge.mojoc src/cryoluge"
depends-on = ["build_dir"]

[tasks.build_test]
cmd = "mojo build -I build -D ASSERT=all --debug-level line-tables -o build/cryoluge_test test/suite.mojo"
# NOTE: `--debug-level full` is VERY slow to compile! don't use it unless you really need it
depends-on = ["build_pkg"]

[tasks.test]
cmd = "build/cryoluge_test"
env = { MODULAR_DEBUG = "stack-trace-on-error" }
depends-on = ["build_test"]
